<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <title><!-- TITLE --> — Resume Studio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body
        class="text-slate-900 font-sans bg-slate-100 print:bg-white print:text-black antialiased selection:bg-indigo-100 selection:text-indigo-900"
    >
        <!-- Top Studio Navbar (Hidden when printing) -->
        <header
            class="print:hidden sticky top-0 z-40 h-14 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-5 flex items-center justify-between gap-4 text-white shadow-sm"
        >
            <div class="flex items-center gap-4">
                <a
                    href="index.html"
                    class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-300 hover:text-white px-2.5 py-1.5 rounded-md bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 transition-colors"
                >
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                    Public View
                </a>
                <div class="flex items-center gap-2.5">
                    <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                    <span class="text-sm font-semibold tracking-tight text-slate-100">Resume Tailoring Studio</span>
                    <span class="hidden sm:inline-block text-[11px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full border border-slate-700">
                        Drag &amp; Drop Enabled
                    </span>
                </div>
            </div>

            <!-- Presets & Actions -->
            <div class="flex items-center gap-2.5">
                <div class="relative flex items-center">
                    <select
                        id="preset-select"
                        class="text-xs bg-slate-800 border border-slate-700 text-slate-200 rounded-md pl-3 pr-7 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 hover:border-slate-600 transition-colors cursor-pointer"
                    >
                        <option value="">Load JD Preset...</option>
                    </select>
                </div>

                <button
                    id="btn-save-preset"
                    type="button"
                    class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-md bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700 hover:text-white transition-colors"
                >
                    <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
                    </svg>
                    Save Preset
                </button>

                <button
                    id="btn-reset"
                    type="button"
                    class="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1.5 rounded-md text-slate-400 hover:text-rose-300 hover:bg-rose-950/50 border border-transparent hover:border-rose-800/60 transition-colors"
                    title="Reset all changes back to default TOML"
                >
                    Reset
                </button>

                <div class="h-4 w-[1px] bg-slate-700 mx-0.5"></div>

                <button
                    id="btn-print"
                    type="button"
                    class="inline-flex items-center gap-1.5 text-xs font-semibold px-3.5 py-1.5 rounded-md bg-indigo-600 text-white hover:bg-indigo-500 shadow-sm shadow-indigo-950/50 transition-all"
                >
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0110.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0l.229 2.523a1.125 1.125 0 01-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0021 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 00-1.913-.247M6.34 18H5.25A2.25 2.25 0 013 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 011.913-.247m10.5 0a48.536 48.536 0 00-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5zm-3 0h.008v.008H15V10.5z" />
                    </svg>
                    Print / Export PDF
                </button>
            </div>
        </header>

        <!-- Studio Split Workspace -->
        <div
            class="max-w-[1680px] mx-auto flex flex-col lg:flex-row print:block"
        >
            <!-- Left Inspector Drawer (Hidden when printing) -->
            <aside
                class="print:hidden w-full lg:w-[460px] xl:w-[500px] flex-shrink-0 bg-white border-r border-slate-200/90 lg:h-[calc(100vh-3.5rem)] lg:sticky lg:top-14 flex flex-col"
            >
                <!-- Category Filter Tabs -->
                <div
                    id="customizer-tabs"
                    class="flex items-center gap-1 px-3 py-2 bg-slate-50 border-b border-slate-200 overflow-x-auto workbench-scroll"
                ></div>

                <!-- Scrollable Controls Area -->
                <div
                    id="customizer-controls"
                    class="flex-1 overflow-y-auto p-4 space-y-4 workbench-scroll"
                ></div>
            </aside>

            <!-- Right Live A4 Document Canvas -->
            <div
                class="flex-1 bg-slate-100/80 p-4 sm:p-8 flex justify-center items-start overflow-x-auto print:p-0 print:m-0 print:bg-white print:block"
            >
                <div
                    id="resume-sheet"
                    style="color-scheme: light;"
                    class="a4-print a4-preview-sheet bg-white text-gray-900 shadow-xl ring-1 ring-slate-900/5 rounded-sm print:shadow-none print:ring-0 print:rounded-none print:p-2 print:m-0 print:max-w-full print:w-full print:text-xs"
                >
<!-- HEADER -->
                    <main class="resume-block">
                        <div class="flex flex-col gap-8 print:gap-2">
                            <section
                                class="space-y-8 print:space-y-1 resume-block"
                                data-container="main-sections"
                            >
<!-- MAIN_SECTIONS -->
                            </section>
                            <aside
                                class="space-y-8 print:space-y-1 resume-block"
                                data-container="aside-sections"
                            >
<!-- ASIDE_SECTIONS -->
                            </aside>
                        </div>
                    </main>
                </div>
            </div>
        </div>

<!-- CUSTOMIZER_SCRIPT -->
    </body>
</html>
